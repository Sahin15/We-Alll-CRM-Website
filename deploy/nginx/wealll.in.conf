# nginx vhost for production wealll.in
# On VPS install as /etc/nginx/sites-enabled/crm-production (or your existing prod site file)
#
# Install:
#   sudo cp deploy/nginx/wealll.in.conf /etc/nginx/sites-enabled/crm-production
#   sudo certbot --nginx -d wealll.in
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust `root` if your server uses a different publish path (must match where deploy.sh builds).

server {
    server_name wealll.in www.wealll.in;

    root /root/crm-website/frontend/dist;
    index index.html;

    client_max_body_size 10M;

    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }

    location /ws {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/wealll.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wealll.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name wealll.in www.wealll.in;
    return 301 https://$host$request_uri;
}