# nginx vhost for uat.wealll.cloud
# Install: sudo cp deploy/nginx/uat.wealll.cloud.conf /etc/nginx/sites-available/uat.wealll.cloud
#          sudo ln -sf /etc/nginx/sites-available/uat.wealll.cloud /etc/nginx/sites-enabled/
#          sudo certbot --nginx -d uat.wealll.cloud
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name uat.wealll.cloud;

    root /var/www/crm-uat/frontend/dist;
    index index.html;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
