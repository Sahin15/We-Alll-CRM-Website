# nginx vhost for uat.wealll.cloud
# On VPS this file is installed as /etc/nginx/sites-enabled/crm-uat
#
# Install:
#   sudo cp deploy/nginx/uat.wealll.cloud.conf /etc/nginx/sites-enabled/crm-uat
#   sudo nginx -t && sudo systemctl reload nginx
#
# Static files are served from WEB_ROOT (see deploy-uat.sh).
# Git/build live in /root/crm-website-uat on the Hostinger VPS.

server {
    server_name uat.wealll.cloud;

    root /var/www/crm-uat/frontend/dist;
    index index.html;

    client_max_body_size 10M;

    location /api {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }

    location /ws {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/uat.wealll.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uat.wealll.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = uat.wealll.cloud) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name uat.wealll.cloud;
    return 404;
}
