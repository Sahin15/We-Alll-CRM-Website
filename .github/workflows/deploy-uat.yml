name: Deploy UAT

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-uat
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to uat.wealll.cloud
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /var/www/crm-uat
            bash deploy-uat.sh
