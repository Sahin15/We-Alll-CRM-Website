<!DOCTYPE html>
<html>
<head>
    <title>Test Authentication</title>
</head>
<body>
    <h1>Authentication Test</h1>
    <div id="status"></div>
    <button onclick="checkAuth()">Check Auth Status</button>
    <button onclick="testLogin()">Test Login</button>
    <button onclick="testFeedback()">Test Feedback</button>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        
        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            document.getElementById('status').innerHTML = `
                <h3>Auth Status:</h3>
                <p>Token: ${token ? 'Present' : 'Missing'}</p>
                <p>User: ${user ? JSON.parse(user).name : 'Not logged in'}</p>
            `;
        }
        
        async function testLogin() {
            try {
                const response = await fetch(`${API_BASE}/users/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'rakeshwealll@gmail.com',
                        password: 'password123'
                    })
                });
                
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    alert('Login successful!');
                    checkAuth();
                } else {
                    alert('Login failed: ' + data.message);
                }
            } catch (error) {
                alert('Login error: ' + error.message);
            }
        }
        
        async function testFeedback() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Please login first');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/feedback`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        category: 'bug_report',
                        title: 'Test Feedback from HTML',
                        description: 'This is a test feedback submission.',
                        priority: 'medium',
                        isAnonymous: false,
                        tags: 'test'
                    })
                });
                
                const data = await response.json();
                if (response.ok) {
                    alert('Feedback submitted successfully!');
                } else {
                    alert('Feedback failed: ' + data.message);
                }
            } catch (error) {
                alert('Feedback error: ' + error.message);
            }
        }
        
        // Check auth on load
        checkAuth();
    </script>
</body>
</html>
