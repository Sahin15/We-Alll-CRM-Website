<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Wealll_mini.png" />
    <link rel="apple-touch-icon" href="/Wealll_mini.png" />
    
    <!-- Mobile viewport configuration - iOS optimized -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, minimal-ui" />
    
    <!-- iOS specific meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="We Alll Office" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Android specific meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#4F46E5" />
    
    <!-- Prevent search engine indexing (internal office use only) -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="description" content="Internal office management system - Private access only" />
    
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- DNS prefetch for better performance -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS Safari fix for localStorage -->
    <script>
      // Test localStorage availability (iOS Safari private mode blocks it)
      try {
        localStorage.setItem('test', 'test');
        localStorage.removeItem('test');
      } catch (e) {
        console.warn('localStorage not available, using fallback');
        // Fallback to sessionStorage or memory storage
        window.localStorage = window.sessionStorage;
      }
      
      // iOS-specific fixes and error detection
      (function() {
        window.__WEALLL_APP_MOUNTED__ = false;

        window.__WEALLL_LOAD_ERROR__ = null;

        function showLoadError() {
          if (window.__WEALLL_APP_MOUNTED__) return;
          var root = document.getElementById('root');
          if (!root || window.__WEALLL_APP_MOUNTED__) return;
          var detail = window.__WEALLL_LOAD_ERROR__
            ? '<p style="font-size:12px;color:#666;margin-top:8px;word-break:break-word;">' + window.__WEALLL_LOAD_ERROR__ + '</p>'
            : '';
          root.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#f8d7da;font-family:sans-serif;padding:20px;"><div style="text-align:center;color:#721c24;max-width:420px;"><h2 style="margin:0 0 10px;">Loading Error</h2><p>The app failed to load. Please try:</p><ul style="text-align:left;"><li>Hard refresh (Ctrl+Shift+R)</li><li>Clear browser cache / unregister service worker</li><li>Ensure the server ran <code>npm run build</code> after deploy</li></ul>' + detail + '<button onclick="location.reload()" style="margin-top:20px;padding:10px 20px;background:#dc3545;color:white;border:none;border-radius:5px;font-size:16px;cursor:pointer;">Reload Page</button></div></div>';
        }

        // Large production bundles can take >10s on slow networks — allow 45s
        var loadTimeout = setTimeout(showLoadError, 45000);

        // Capture failed JS/CSS asset loads (stale deploy, 404 chunks)
        window.addEventListener('error', function(e) {
          var target = e.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            window.__WEALLL_LOAD_ERROR__ = 'Failed to load: ' + (target.src || target.href || 'asset');
            console.error('Asset load failed:', target.src || target.href);
          } else if (e.message) {
            window.__WEALLL_LOAD_ERROR__ = e.message;
          }
        }, true);
        
        // Clear timeout when React mounts (main.jsx sets __WEALLL_APP_MOUNTED__)
        window.addEventListener('wealll-app-mounted', function() {
          clearTimeout(loadTimeout);
        });

        // If the main module is still downloading, extend patience (production ~8MB chunk)
        var extendCheck = setInterval(function() {
          if (window.__WEALLL_APP_MOUNTED__) {
            clearInterval(extendCheck);
            clearTimeout(loadTimeout);
          }
        }, 2000);
        
        // Catch and log any errors
        window.addEventListener('error', function(e) {
          console.error('Global error:', e.error || e.message);
        });
        
        window.addEventListener('unhandledrejection', function(e) {
          console.error('Unhandled promise rejection:', e.reason);
        });
      })();
    </script>
    
    <title>We Alll Office</title>
  </head>
  <body>
    <div id="root">
      <!-- Loading screen for initial load -->
      <div style="
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      ">
        <div style="text-align: center; color: white;">
          <div style="
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
          "></div>
          <h2 style="margin: 0; font-size: 24px; font-weight: 600;">We Alll Office</h2>
          <p style="margin: 10px 0 0; font-size: 14px; opacity: 0.9;">Loading...</p>
        </div>
      </div>
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        /* iOS Safari fixes */
        * {
          -webkit-tap-highlight-color: transparent;
          -webkit-touch-callout: none;
        }
        body {
          -webkit-user-select: none;
          -webkit-overflow-scrolling: touch;
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
